[paths]
raw_attributes = data/raw/list_attr_celeba.txt
processed_dataset = data/processed/celeba_smiling.csv
model_path = models/model.joblib
metrics_path = reports/metrics.json

[data]
target_attribute = Smiling
test_size = 0.2
random_state = 42
max_rows = 5000
demo_if_missing = true

[model]
algorithm = logistic_regression
C = 1.0
max_iter = 1000
class_weight = balanced
solver = liblinear

[quality]
min_accuracy = 0.65
min_f1 = 0.65
