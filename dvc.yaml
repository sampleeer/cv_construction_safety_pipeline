stages:
  prepare:
    cmd: python -m src.data.prepare --config config.ini
    deps:
      - config.ini
      - src/config.py
      - src/data/prepare.py
      - data/raw
    outs:
      - data/processed/celeba_smiling.csv

  train:
    cmd: python -m src.models.train --config config.ini
    deps:
      - config.ini
      - src/config.py
      - src/models/train.py
      - data/processed/celeba_smiling.csv
    outs:
      - models/model.joblib

  evaluate:
    cmd: python -m src.models.evaluate --config config.ini
    deps:
      - config.ini
      - src/config.py
      - src/models/evaluate.py
      - data/processed/celeba_smiling.csv
      - models/model.joblib
    metrics:
      - reports/metrics.json:
          cache: false
