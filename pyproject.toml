[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=src --cov-report=term-missing --cov-report=xml --junitxml=reports/junit.xml"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
line-length = 120

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "yaml"
follow_untyped_imports = true
