services:
  api:
    build: .
    image: ${DOCKER_IMAGE:-cv-mlops:local}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      ORT_THREADS: ${ORT_THREADS:-2}
      MAX_INFLIGHT: ${MAX_INFLIGHT:-2}
      HELMET_DB: /app/artifacts/events.sqlite
      HELMET_SNAPSHOTS: /app/artifacts/snapshots
    volumes:
      - helmet-events:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  cd-tests:
    build: .
    image: ${DOCKER_IMAGE:-cv-mlops:local}
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "scripts/smoke_cv.py", "--url", "http://api:8000"]

volumes:
  helmet-events:
