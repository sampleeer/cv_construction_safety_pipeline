name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/celeba-smiling-api:${{ github.sha }}

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run DVC pipeline
        run: dvc repro

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME" .

      - name: Login to DockerHub
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'pull_request'
        run: docker push "$IMAGE_NAME"

      - name: Generate DevSecOps metadata
        run: python scripts/generate_dev_sec_ops.py --image "$IMAGE_NAME" --coverage coverage.xml --output dev_sec_ops.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            reports/metrics.json
            coverage.xml
            dev_sec_ops.yml
