name: helmet-ci
on:
  pull_request:
  push:
    branches: [main, lab1]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: make lint typecheck test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            reports/junit.xml
            coverage.xml
  release-validation:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-export.txt
      - run: python scripts/download_model.py
      - run: python -m src.helmet.download
      - run: dvc repro
      - run: docker compose up --build --abort-on-container-exit --exit-code-from cd-tests cd-tests
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: validated-model
          path: |
            models/cv
            reports/cv-benchmark.json
            reports/helmet-quality.json
      - name: Require qualified full model before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -c "import json; m=json.load(open('models/cv/manifest.json')); assert m['release_status']=='qualified', 'Experimental models cannot be published as qualified releases'"
      - name: Login to GHCR for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:${RELEASE_TAG}"
          docker tag cv-mlops:local "$IMAGE"
          docker push "$IMAGE"
    permissions:
      contents: read
      packages: write
